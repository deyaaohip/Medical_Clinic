services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: medsaas
      POSTGRES_PASSWORD: medsaas_dev_password
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsaas -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Single app service. On startup it (1) installs dependencies from the lockfile
  # when they are missing or stale, (2) pushes the Drizzle schema (the repo ships
  # no migration files) and (3) seeds demo data only into an empty database, then
  # runs the Next.js dev server from the bind-mounted source.
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://medsaas:medsaas_dev_password@db:5432/app_db
      - NEXT_TELEMETRY_DISABLED=1
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
    command:
      - sh
      - -ec
      - |
        LOCK_HASH=$$(sha256sum package-lock.json | cut -d' ' -f1)
        if [ ! -d node_modules/next ] || [ "$$(cat node_modules/.base44-lock 2>/dev/null)" != "$$LOCK_HASH" ]; then
          echo "Installing dependencies with npm ci..."
          npm ci --no-audit --no-fund
          echo "$$LOCK_HASH" > node_modules/.base44-lock
        else
          echo "Dependencies already installed for current lockfile."
        fi

        echo "Pushing database schema..."
        npx drizzle-kit push --dialect=postgresql --schema=./src/db/schema.ts --url="$$DATABASE_URL" --force

        if node -e 'const {Pool}=require("pg");const p=new Pool({connectionString:process.env.DATABASE_URL});p.query("select count(*)::int as n from tenants").then(r=>{console.log("tenants already present: "+r.rows[0].n);process.exit(r.rows[0].n>0?0:1)}).catch(e=>{console.error("seed check:",e.message);process.exit(1)})'; then
          echo "Database already seeded - skipping."
        else
          echo "Empty database - seeding demo data..."
          npx tsx src/db/runSeedScript.ts
        fi

        exec npx next dev --hostname 0.0.0.0 --port 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

volumes:
  pgdata:
  node_modules:
